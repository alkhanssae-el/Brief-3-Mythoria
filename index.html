<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mythoria</title>
    <link rel="icon" href="img/mythoria_icon.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
@font-face {
    font-family: "Mideltank";
    src: url("fonts/Mideltank.otf") format("opentype");
    font-weight: normal;
    font-style: normal;
}

.mideltank-font {
    font-family: "Mideltank", sans-serif;
}

@font-face {
    font-family: "Dynatecha";
    src: url("fonts/Dynatecha.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
}

.dynatecha-font {
    font-family: "Dynatecha", sans-serif;
}

@font-face {
    font-family: "Stormfaze";
    src: url("fonts/Stormfaze.otf") format("opentype");
    font-weight: normal;
    font-style: normal;
}

.stormfaze-font {
    font-family: "Stormfaze", sans-serif;
}

@font-face {
    font-family: "Varsity";
    src: url("fonts/Varsity.otf") format("opentype");
    font-weight: normal;
    font-style: normal;
}

.varsity-font {
    font-family: "Varsity", sans-serif;
}


    </style>

</head>

<body class="overflow-x-hidden">
    <header class="bg-slate-900">
        <nav class="flex bg-black items-center justify-between px-4 md:px-10 py-2">
            <div class="text-white">
                <a href="index.html" class="logo">
                    <img src="img/mythoria_logo.jpg" alt="logo" class="w-32 sm:w-48 md:w-70">
                </a>
            </div>
            <div class="text-white mideltank-font flex gap-4 sm:gap-6 md:gap-10 text-sm sm:text-base">
                <a href="index.html" class="hover:text-yellow-200">Home</a>
                <a href="shop.html" class="hover:text-yellow-200">Booster Shop</a>
                <a href="collection.html" class="hover:text-yellow-200">Collection</a>
            </div>
        </nav>
    </header>
    
    <main>
        <section class="relative w-full min-h-[calc(100dvh-72px)] overflow-hidden bg-black">
            <div class="absolute inset-0 bg-[url(img/mythoria_background.jpg)] bg-cover bg-center bg-no-repeat brightness-50"></div>
            <div class="relative z-10 flex flex-col items-center justify-center text-center min-h-[calc(100dvh-72px)] px-4 gap-4 md:gap-6">
                <h1 class="text-shadow-lg/30 text-5xl sm:text-7xl md:text-8xl lg:text-9xl mideltank-font text-white">MYTHORIA</h1>
                <p class="text-shadow-lg/30 text-sm sm:text-lg md:text-1xl dynatecha-font text-white">Every pack holds a legend that could change your fate</p>
                <div>
                    <a href="shop.html">
                        <button type="button" class="shadow-[0_0_7px_black] bg-yellow-200 text-black stormfaze-font px-6 py-2 rounded-sm cursor-pointer hover:bg-yellow-400 transition">
                            Discover the boosters
                        </button>
                    </a>
                    <a href="collection.html">
                        <button type="button" class="shadow-[0_0_7px_black] bg-yellow-200 text-black stormfaze-font px-6 py-2 rounded-sm cursor-pointer hover:bg-yellow-400 transition">
                            Open my grimoire
                        </button>
                    </a>
                </div>
        </section>
        <section class="w-full min-h-[calc(100dvh-72px)] overflow-hidden bg-black">
            <div class="flex flex-col items-center text-center gap-20">
                <h1 class="text-white text-5xl varsity-font mt-45">Cards overview</h1>
                <div class="flex items-center gap-10 m-10 brightness-80">
                    <div class="hover:-translate-y-3 transition-transform duration-300">
                        <p class="text-white" >HERO</p>
                        <img src="img/card.jpg" alt="hero card">
                    </div>
                    <div class="hover:-translate-y-3 transition-transform duration-300">
                        <p class="text-white">SERVANT</p>
                        <img src="img/card.jpg" alt="servant card">
                    </div>
                    <div class="hover:-translate-y-3 transition-transform duration-300">
                        <p class="text-white">SPELL</p>
                        <img src="img/card.jpg" alt="spell card">
                    </div>
                    <div class="hover:-translate-y-3 transition-transform duration-300">
                        <p class="text-white">CREATURE</p>
                        <img src="img/card.jpg" alt="creature card">
                    </div>
                </div>
            </div>
        </section>
        <section class="w-full min-h-[calc(100dvh-72px)] overflow-hidden bg-black">
            <div class="flex flex-col items-center text-center gap-20">
                <h1 class="text-white text-5xl varsity-font mt-45">Available boosters</h1>
                <div class="flex items-center m-10 gap-10 brightness-80">
                    <div>
                        <img class="hover:-translate-y-3 transition-transform duration-300" src="img/booster.png" alt="booster">
                    </div>
                    <div>
                        <img class="hover:-translate-y-3 transition-transform duration-300" src="img/booster.png" alt="booster">
                    </div>
                    <div>
                        <img class="hover:-translate-y-3 transition-transform duration-300" src="img/booster.png" alt="booster">
                    </div>
                    <div>
                        <img class="hover:-translate-y-3 transition-transform duration-300" src="img/booster.png" alt="booster">
                    </div>
                    <div>
                        <img class="hover:-translate-y-3 transition-transform duration-300" src="img/booster.png" alt="booster">
                    </div>
                    <div>
                        <img class="hover:-translate-y-3 transition-transform duration-300" src="img/booster.png" alt="booster">
                    </div>
                </div>
            </div>
        </section>
        <section class="w-full min-h-[calc(100dvh-72px)] overflow-hidden bg-black">
            <div class="flex flex-col items-center text-center gap-20">
                <h1 class="text-white text-5xl varsity-font mt-45">Legendary cards</h1>
                <div class="flex items-center w-280 m-10 gap-10 brightness-80">
                    <div> 
                        <img class="hover:-translate-y-3 transition-transform duration-300" src="img/legendary.jpg" alt="legendary card">
                    </div>
                    <div>
                        <img class="hover:-translate-y-3 transition-transform duration-300" src="img/legendary.jpg" alt="legendary card">
                    </div>
                    <div>
                        <img class="hover:-translate-y-3 transition-transform duration-300" src="img/legendary.jpg" alt="legendary card">
                    </div>
                </div>
            </div>
        </section>
</body>
</html>
