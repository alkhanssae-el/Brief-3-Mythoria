<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mythoria</title>
    <link rel="icon" href="img/mythoria_icon.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
@font-face {
    font-family: "Mideltank";
    src: url("fonts/Mideltank.otf") format("opentype");
    font-weight: normal;
    font-style: normal;
}

.mideltank-font {
    font-family: "Mideltank", sans-serif;
}

@font-face {
    font-family: "Dynatecha";
    src: url("fonts/Dynatecha.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
}

.dynatecha-font {
    font-family: "Dynatecha", sans-serif;
}

@font-face {
    font-family: "Stormfaze";
    src: url("fonts/Stormfaze.otf") format("opentype");
    font-weight: normal;
    font-style: normal;
}

.stormfaze-font {
    font-family: "Stormfaze", sans-serif;
}

@font-face {
    font-family: "Varsity";
    src: url("fonts/Varsity.otf") format("opentype");
    font-weight: normal;
    font-style: normal;
}

.varsity-font {
    font-family: "Varsity", sans-serif;
}


    </style>

</head>

<body>
    <header>
        <nav class="bg-black w-full h-17">
            <div class="flex justify-around items-center w-full h-17">
                <div>
                    <a href="index.html" class="logo">
                        <img src="img/mythoria_logo.jpg" alt="logo" class="w-65">
                    </a>
                </div>
                <div class="flex gap-15 text-white mideltank-font">
                    <a href="index.html" class="hover:text-yellow-200">Home</a>
                    <a href="shop.html" class="hover:text-yellow-200">Booster Shop</a>
                    <a href="collection.html" class="hover:text-yellow-200">Collection</a>
                </div>
                <div>
                    <a href="shop.html" class="Shopping cart">
                        <img src="img/shopping-cart.png" alt="shopping cart" class="w-5">
                    </a>
                </div>
            </div>
        </nav>
    </header>
    
    <main>
        <div class="bg-[url(/img/mythoria_background.jpg)] w-full h-screen bg-no-repeat bg-cover bg-center pt-60 flex flex-col gap-5">
            <h1 class="text-white text-9xl text-shadow-lg text-shadow-black text-center mideltank-font">MYTHORIA</h1>
            <p class="text-white text-lg text-shadow-md text-shadow-black text-center dynatecha-font">Open the pack and awaken the legend</p>
            <div class="flex justify-center gap-3">
                <a href="shop.html">
                    <button class="cursor-pointer shadow-md shadow-black border bg-yellow-100 hover:bg-yellow-200 w-60 h-10 stormfaze-font text-sm rounded-sm">Discover the boosters</button>
                </a>
                <a href="collection.html">
                    <button class="cursor-pointer shadow-md shadow-black border bg-yellow-100 hover:bg-yellow-200 w-60 h-10 stormfaze-font text-sm rounded-sm">Open my grimoire</button>
                </a>
            </div>
        </div>
        <div class="bg-black w-full h-screen flex flex-col justify-center">
            <h1 class="text-white">Cards overview</h1>
            <div class="flex w-60 gap-10">
                <img src="img/card_creature.png">
                <img src="img/card_hero.png">
                <img src="img/card_spell.png">
                <img src="img/card_servant.png">
            </div>
        </div>
    </main>
</body>
</html>
